name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test IDE and GitHub Action integrations
        run: >-
          node --test
          integrations/vscode/core.test.js
          integrations/github-action/core.test.js
          integrations/github-action/index.test.js
      - name: Test Unix installer matrix
        run: bash scripts/test-install.sh
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Verify model-free default dependency graph
        run: |
          set -euo pipefail
          cargo check --locked --no-default-features
          if cargo tree --locked --no-default-features --edges normal \
            | grep -E '(^| )((a3s-power|fastembed|ort|ort-sys) v)'; then
            echo "::error::The default build must not include inference or artifact-provisioning runtimes"
            exit 1
          fi
      - name: Test local CPU retrieval control plane
        run: >-
          cargo test --locked --features local-cpu-embedding --bin a3s
          workspace_retrieval
      - run: cargo build --locked --release --features local-cpu-embedding
      - name: Prepare immutable local CPU runtime fixture
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP 'a3s-power-data'
          $bundleRoot = Join-Path $dataRoot 'power/artifact-bundles/a3s-code/all-minilm-l6-v2/751bff37182d3f1213fa05d7196b954e230abad9'
          $manifest = & .github/scripts/prepare-local-cpu-embedding-fixture.ps1 -Destination $bundleRoot
          "A3S_LOCAL_CPU_SMOKE_MODEL_MANIFEST=$manifest" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A3S_LOCAL_CPU_MANAGED_DATA_ROOT=$dataRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise real local CPU inference offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          cargo test --offline --locked --features local-cpu-embedding --bin a3s
          real_local_cpu_model_executes_offline_runtime_contract --
          --ignored --nocapture

  native-sandbox:
    name: Exercise native sandbox (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-22.04 }
          - { platform: macos, os: macos-latest }
          - { platform: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision Linux namespace boundary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
      - name: Prove the native sandbox integration
        shell: bash
        run: >-
          cargo test --locked --bin a3s
          commands::code::sandbox::tests::real_native_sandbox_enforces_local_policy
          -- --ignored --exact --nocapture

  # Validate the TUI compiles for Windows + macOS so all three desktop
  # platforms can run `a3s code` (Linux is covered by `check` above).
  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows installer matrix
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test TUI exit regression
        if: runner.os == 'macOS'
        # These PTY probes intentionally create a 25,000-file workspace and a
        # blocked repository scan. Run them serially so one lifecycle fixture
        # cannot distort the other probe's timing or scheduler progress.
        run: cargo test --locked --test tui_exit -- --nocapture --test-threads=1
      - run: cargo build --locked --release --features local-cpu-embedding
        env:
          # Cross-platform PR validation does not need LTO, and rustc 1.97 can
          # segfault while optimizing chromiumoxide_cdp on macOS arm64.
          CARGO_PROFILE_RELEASE_LTO: "false"
      - name: Prepare immutable local CPU runtime fixture
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP 'a3s-power-data'
          $bundleRoot = Join-Path $dataRoot 'power/artifact-bundles/a3s-code/all-minilm-l6-v2/751bff37182d3f1213fa05d7196b954e230abad9'
          $manifest = & .github/scripts/prepare-local-cpu-embedding-fixture.ps1 -Destination $bundleRoot
          "A3S_LOCAL_CPU_SMOKE_MODEL_MANIFEST=$manifest" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A3S_LOCAL_CPU_MANAGED_DATA_ROOT=$dataRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise real local CPU inference offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          cargo test --offline --locked --features local-cpu-embedding --bin a3s
          real_local_cpu_model_executes_offline_runtime_contract --
          --ignored --nocapture
      - name: Upload macOS TUI smoke bundle
        if: runner.os == 'macOS' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: a3s-code-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/release/a3s
            ${{ runner.temp }}/a3s-power-data
          if-no-files-found: error
          retention-days: 3

  local-cpu-linux-arm64:
    name: Exercise local CPU inference on Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test the bounded local CPU scheduler
        run: >-
          cargo test --locked --features local-cpu-embedding --bin a3s
          cancellation_storm_preserves_the_native_inference_bound_and_recovers
      - name: Prepare immutable local CPU runtime fixture
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP 'a3s-power-data'
          $bundleRoot = Join-Path $dataRoot 'power/artifact-bundles/a3s-code/all-minilm-l6-v2/751bff37182d3f1213fa05d7196b954e230abad9'
          $manifest = & .github/scripts/prepare-local-cpu-embedding-fixture.ps1 -Destination $bundleRoot
          "A3S_LOCAL_CPU_SMOKE_MODEL_MANIFEST=$manifest" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A3S_LOCAL_CPU_MANAGED_DATA_ROOT=$dataRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise real local CPU inference offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          cargo test --offline --locked --features local-cpu-embedding --bin a3s
          real_local_cpu_model_executes_offline_runtime_contract --
          --ignored --nocapture
