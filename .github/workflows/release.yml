name: CLI Release
# One tag → all channels, so they never drift. Requires two repo secrets:
#   CARGO_REGISTRY_TOKEN  — crates.io publish
#   HOMEBREW_TAP_TOKEN    — write access to A3S-Lab/homebrew-tap
# Every publishing job waits for immutable release-input, native-helper, and
# Moli-runtime preflights. GitHub assets remain in an owned draft until the
# crate and every target archive have been published and independently verified.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to rebuild or recover
        required: true
        type: string
      release_target:
        description: Optional single target to rebuild during recovery
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RECOVERY_TARGET: ${{ inputs.release_target || '' }}
  # Exact companion prerequisite; preflight rejects an absent or incomplete release.
  A3S_WEBVIEW_VERSION: 0.1.5
  A3S_MOLI_VERSION: 1.1.1
  A3S_CODE_CORE_VERSION: 8.1.0
  A3S_CODE_CORE_REVISION: d9c2050b3ca60c70c1146620d24da82b4907191a
  A3S_BOX_RUNTIME_VERSION: 3.2.0
  A3S_FLOW_VERSION: 1.1.0
  A3S_GATEWAY_VERSION: 1.1.1
  A3S_SEARCH_VERSION: 3.1.0
  A3S_SEARCH_REVISION: c30e3dd04de8f2874113cda435439d6938bd3eb6
  A3S_MEMORY_VERSION: 0.1.4
  A3S_MEMORY_REVISION: 97a5e885d196be77dc1823ad86238e77d942ed73
  A3S_TUI_VERSION: 0.1.14
  A3S_USE_EXTENSION_VERSION: 0.3.4
jobs:
  release-preflight:
    name: Verify CLI release inputs
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release-context.outputs.release_sha }}
      release_matrix: ${{ steps.release-matrix.outputs.release_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Validate tag and release state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release publishing requires a stable vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF_TYPE" = "branch"
            test "$GITHUB_REF_NAME" = "main"
          fi
          version="${RELEASE_TAG#v}"
          bash .github/scripts/test-check-release-state.sh
          bash .github/scripts/check-release-state.sh \
            "$version" "$A3S_CODE_CORE_VERSION" "$A3S_TUI_VERSION" \
            "$A3S_SEARCH_VERSION" "$A3S_CODE_CORE_REVISION" \
            "$A3S_SEARCH_REVISION" "$A3S_MEMORY_VERSION" \
            "$A3S_MEMORY_REVISION"

          git fetch --no-tags origin main:refs/remotes/origin/main
          checkout_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$checkout_sha" origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main"
            exit 1
          fi

          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if ! [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest GitHub release has an invalid stable tag: $latest_tag"
            exit 1
          fi
          latest_version="${latest_tag#v}"
          lowest="$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | head -n 1)"
          if [ "$lowest" != "$latest_version" ]; then
            echo "::error::Release $version is older than latest release $latest_version"
            exit 1
          fi
      - name: Validate credentials and published dependencies
        id: release-context
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN not set — cannot publish a3s to crates.io"
            exit 1
          fi
          if [[ -z "${TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN not set — cannot publish the a3s Homebrew channel"
            exit 1
          fi
          if [[ "$(GH_TOKEN="$TAP_TOKEN" gh api repos/A3S-Lab/homebrew-tap \
            --jq '.permissions.push // false')" != true ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot write A3S-Lab/homebrew-tap"
            exit 1
          fi

          version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^[[:space:]]*version[[:space:]]*=/ {
              value = $0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$version" || "$RELEASE_TAG" != "v${version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match a3s ${version:-<unknown>}"
            exit 1
          fi
          release_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          checkout_sha="$(git rev-parse HEAD)"
          if [[ -z "$release_sha" || "$release_sha" != "$checkout_sha" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not resolve to the checked-out release commit"
            exit 1
          fi
          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_sha" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
          fi
          if [[ "$remote_tag_sha" != "$release_sha" ]]; then
            echo "::error::Remote tag ${RELEASE_TAG} changed during release preflight"
            exit 1
          fi
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

          crate_exists() {
            curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
              -A "a3s-release-check/1.0" \
              "https://crates.io/api/v1/crates/$1/$2" >/dev/null
          }
          required_crates=(
            "a3s-code-core $A3S_CODE_CORE_VERSION"
            "a3s-box-runtime $A3S_BOX_RUNTIME_VERSION"
            "a3s-power 0.9.0"
            "a3s-deep-research 0.1.4"
            "a3s-boot 0.1.3"
            "a3s-lane 0.5.1"
            "a3s-flow $A3S_FLOW_VERSION"
            "a3s-gateway $A3S_GATEWAY_VERSION"
            "a3s-memory $A3S_MEMORY_VERSION"
            "a3s-tui $A3S_TUI_VERSION"
            "a3s-search $A3S_SEARCH_VERSION"
            "a3s-acl 0.2.2"
            "a3s-updater 0.3.0"
            "a3s-runtime 0.3.0"
            "a3s-use 0.3.4"
            "a3s-use-core 0.2.4"
            "a3s-use-extension $A3S_USE_EXTENSION_VERSION"
          )
          for requirement in "${required_crates[@]}"; do
            read -r crate dependency_version <<<"$requirement"
            if ! crate_exists "$crate" "$dependency_version"; then
              echo "::error::$crate $dependency_version is not on crates.io yet — cannot publish a3s"
              exit 1
            fi
          done
      - name: Resolve binary target matrix
        id: release-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Intel macOS remains model-free because ort 2.0.0-rc.12 has no
          # prebuilt runtime for that target.
          matrix="$(jq -cn '[
            {"target": "aarch64-apple-darwin", "os": "macos-latest", "helper": "a3s-webview", "moli": "moli", "features": "local-cpu-embedding", "lto": "true"},
            {"target": "x86_64-apple-darwin", "os": "macos-15-intel", "helper": "a3s-webview", "moli": "moli", "features": "", "lto": "true"},
            {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "helper": "a3s-webview", "moli": "moli", "features": "local-cpu-embedding", "lto": "true"},
            {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-24.04-arm", "helper": "a3s-webview", "moli": "moli", "features": "local-cpu-embedding", "lto": "false"},
            {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "helper": "a3s-webview.exe", "moli": "moli.exe", "features": "local-cpu-embedding", "lto": "true"}
          ]')"
          if [[ -n "$RECOVERY_TARGET" ]]; then
            matrix="$(jq -c --arg target "$RECOVERY_TARGET" \
              '[.[] | select(.target == $target)]' <<<"$matrix")"
            if [[ "$(jq length <<<"$matrix")" -ne 1 ]]; then
              echo "::error::Unsupported release recovery target: ${RECOVERY_TARGET}"
              exit 1
            fi
          fi
          printf 'release_matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  webview-helper-preflight:
    name: Verify Agent Island helper (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, helper: a3s-webview }
          - { target: x86_64-apple-darwin, helper: a3s-webview }
          - { target: x86_64-unknown-linux-gnu, helper: a3s-webview }
          - { target: aarch64-unknown-linux-gnu, helper: a3s-webview }
          - { target: x86_64-pc-windows-msvc, helper: a3s-webview.exe }
    steps:
      - name: Verify pinned helper release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ matrix.target }}
          HELPER_NAME: ${{ matrix.helper }}
        run: |
          set -euo pipefail
          if [[ ! "$A3S_WEBVIEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A3S_WEBVIEW_VERSION must be an exact semantic version"
            exit 1
          fi

          tag="v${A3S_WEBVIEW_VERSION}"
          base="a3s-webview-${tag}-${RELEASE_TARGET}"
          archive="${base}.tar.gz"
          checksum="${base}.sha256"
          api_path="repos/A3S-Lab/WebView/releases/tags/${tag}"

          if ! gh api "$api_path" > release.json; then
            echo "::error::Pinned Agent Island helper release ${tag} does not exist"
            echo "::error::Release A3S-Lab/WebView ${tag} with every target asset before releasing the CLI"
            exit 1
          fi
          if ! jq -e --arg tag "$tag" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            release.json >/dev/null; then
            echo "::error::Pinned helper ${tag} must be a published, non-prerelease release"
            exit 1
          fi

          asset_url() {
            jq -er --arg name "$1" \
              '[.assets[] | select(.name == $name)] | if length == 1 then .[0].browser_download_url else empty end' \
              release.json
          }
          if ! archive_url="$(asset_url "$archive")"; then
            echo "::error::Pinned helper release ${tag} is missing exactly one ${archive} asset"
            exit 1
          fi
          asset_names=("$archive")
          asset_urls=("$archive_url")
          if [[ "$RELEASE_TARGET" == "x86_64-pc-windows-msvc" ]]; then
            windows_zip="${base}.zip"
            if ! windows_zip_url="$(asset_url "$windows_zip")"; then
              echo "::error::Pinned helper release ${tag} is missing exactly one ${windows_zip} asset"
              exit 1
            fi
            asset_names+=("$windows_zip")
            asset_urls+=("$windows_zip_url")
          fi
          if ! checksum_url="$(asset_url "$checksum")"; then
            echo "::error::Pinned helper release ${tag} is missing exactly one ${checksum} asset"
            exit 1
          fi

          for index in "${!asset_names[@]}"; do
            curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
              "${asset_urls[$index]}" -o "${asset_names[$index]}"
          done
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
            "$checksum_url" -o "$checksum"

          declare -A published_digests=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            read -r digest listed_asset extra <<<"$line"
            # sha256sum marks binary-mode entries as `*filename` on Windows.
            # Normalize that one transport marker before duplicate/name checks.
            if [[ "${listed_asset:-}" == \** ]]; then
              listed_asset="${listed_asset#\*}"
            fi
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ \
              || -z "${listed_asset:-}" \
              || -n "${extra:-}" \
              || -n "${published_digests[$listed_asset]+present}" ]]; then
              echo "::error::${checksum} contains an invalid or duplicate SHA-256 entry"
              exit 1
            fi
            published_digests["$listed_asset"]="$digest"
          done < "$checksum"
          if [[ "${#published_digests[@]}" -ne "${#asset_names[@]}" ]]; then
            echo "::error::${checksum} does not describe exactly the published archives for ${RELEASE_TARGET}"
            exit 1
          fi
          for asset_name in "${asset_names[@]}"; do
            expected="${published_digests[$asset_name]:-}"
            if [[ -z "$expected" ]]; then
              echo "::error::${checksum} has no SHA-256 entry for ${asset_name}"
              exit 1
            fi
            actual="$(sha256sum "$asset_name" | awk '{ print $1 }')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::SHA-256 mismatch for ${asset_name}"
              exit 1
            fi
          done

          tar -tzf "$archive" > archive-contents.txt
          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..)
                echo "::error::Unsafe path in ${archive}: ${entry}"
                exit 1
                ;;
            esac
          done < archive-contents.txt
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          payload_count="$(find unpacked ! -type d -print | wc -l | tr -d ' ')"
          payload="$(find unpacked ! -type d -print -quit)"
          if [[ "$payload_count" -ne 1 \
            || ! -f "$payload" \
            || "$(basename "$payload")" != "$HELPER_NAME" ]]; then
            echo "::error::${archive} must contain only the ${HELPER_NAME} executable"
            exit 1
          fi
          if [[ "$RELEASE_TARGET" != "x86_64-pc-windows-msvc" && ! -x "$payload" ]]; then
            echo "::error::${archive} does not mark ${HELPER_NAME} executable"
            exit 1
          fi
          file_description="$(file -b "$payload")"
          case "$RELEASE_TARGET" in
            aarch64-apple-darwin)
              [[ "$file_description" == Mach-O\ 64-bit\ arm64* ]] || format_error=1
              ;;
            x86_64-apple-darwin)
              [[ "$file_description" == Mach-O\ 64-bit\ x86_64* ]] || format_error=1
              ;;
            aarch64-unknown-linux-gnu)
              [[ "$file_description" == ELF\ 64-bit* && "$file_description" == *"ARM aarch64"* ]] \
                || format_error=1
              ;;
            x86_64-unknown-linux-gnu)
              [[ "$file_description" == ELF\ 64-bit* && "$file_description" == *"x86-64"* ]] \
                || format_error=1
              ;;
            x86_64-pc-windows-msvc)
              [[ "$file_description" == PE32+\ executable* && "$file_description" == *"x86-64"* ]] \
                || format_error=1
              ;;
            *)
              format_error=1
              ;;
          esac
          if [[ "${format_error:-0}" == 1 ]]; then
            echo "::error::${archive} contains the wrong executable format: ${file_description}"
            exit 1
          fi
          island_usage="usage: a3s-webview --agent-island --snapshot <absolute-path> --lock-file <absolute-path>"
          if ! grep -aFq -- "$island_usage" "$payload" \
            || ! grep -aFq -- "a3s.system_agent_snapshot.v1" "$payload"; then
            echo "::error::${archive} does not expose the required Agent Island snapshot-v1 contract"
            exit 1
          fi
      - name: Preserve verified helper archive
        uses: actions/upload-artifact@v4
        with:
          name: a3s-webview-helper-${{ matrix.target }}
          path: |
            a3s-webview-v${{ env.A3S_WEBVIEW_VERSION }}-${{ matrix.target }}.tar.gz
            a3s-webview-v${{ env.A3S_WEBVIEW_VERSION }}-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 1

  webview-homebrew-preflight:
    name: Verify Agent Island Homebrew formula
    runs-on: ubuntu-latest
    steps:
      - name: Verify the standalone helper formula owns the pinned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${A3S_WEBVIEW_VERSION}"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            repos/A3S-Lab/homebrew-tap/contents/Formula/a3s-webview.rb \
            > a3s-webview.rb
          grep -Fqx "  version \"${A3S_WEBVIEW_VERSION}\"" a3s-webview.rb
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            asset="a3s-webview-${tag}-${target}.tar.gz"
            if ! grep -Fq "/${tag}/${asset}" a3s-webview.rb; then
              echo "::error::Homebrew formula does not reference ${asset}"
              exit 1
            fi
          done

  moli-runtime-preflight:
    name: Verify bundled Moli runtime (${{ matrix.target }})
    needs: release-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, executable: moli }
          - { target: x86_64-apple-darwin, executable: moli }
          - { target: x86_64-unknown-linux-gnu, executable: moli }
          - { target: aarch64-unknown-linux-gnu, executable: moli }
          - { target: x86_64-pc-windows-msvc, executable: moli.exe }
    steps:
      - name: Check out the immutable Code core packaging script
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Code
          ref: ${{ env.A3S_CODE_CORE_REVISION }}
          path: code-core
          fetch-depth: 1
      - name: Install archive inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes file unzip
      - name: Download and verify the pinned Moli package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          MOLI_EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          test "$(git -C code-core rev-parse HEAD)" = "$A3S_CODE_CORE_REVISION"
          manifest="code-core/core/resources/moli-runtime-manifest.json"
          test "$(jq -r .version "$manifest")" = "$A3S_MOLI_VERSION"
          bash code-core/scripts/package_moli.sh "$RELEASE_TARGET" moli-package
          executable="moli-package/$MOLI_EXECUTABLE"
          test -f "$executable"
          test -f moli-package/moli-runtime.json
          if find moli-package -type l | grep -q .; then
            echo "::error::Moli package contains a link"
            exit 1
          fi
          jq -e \
            --arg version "$A3S_MOLI_VERSION" \
            --arg target "$RELEASE_TARGET" \
            --arg archive "$(jq -r --arg target "$RELEASE_TARGET" '.assets[$target].archive' "$manifest")" \
            '.schema == "a3s-code/moli-runtime-package/v1"
             and .version == $version and .target == $target
             and .archive == $archive and (.archive_sha256 | test("^[0-9a-f]{64}$"))' \
            moli-package/moli-runtime.json >/dev/null
          if [[ "$MOLI_EXECUTABLE" == "moli" ]]; then
            test -x "$executable"
            format="$(file -b "$executable")"
            case "$RELEASE_TARGET" in
              aarch64-apple-darwin) [[ "$format" == Mach-O\ 64-bit\ arm64* ]] ;;
              x86_64-apple-darwin) [[ "$format" == Mach-O\ 64-bit\ x86_64* ]] ;;
              aarch64-unknown-linux-gnu) [[ "$format" == ELF\ 64-bit* && "$format" == *"ARM aarch64"* ]] ;;
              x86_64-unknown-linux-gnu) [[ "$format" == ELF\ 64-bit* && "$format" == *"x86-64"* ]] ;;
              *) echo "::error::unexpected Unix Moli target $RELEASE_TARGET"; exit 1 ;;
            esac
          else
            format="$(file -b "$executable")"
            [[ "$format" == PE32+\ executable* && "$format" == *"x86-64"* ]]
          fi
      - name: Preserve verified Moli package
        uses: actions/upload-artifact@v4
        with:
          name: moli-runtime-${{ matrix.target }}
          path: moli-package
          if-no-files-found: error
          retention-days: 1

  create-release:
    needs: [release-preflight, webview-helper-preflight, webview-homebrew-preflight, moli-runtime-preflight]
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ needs.release-preflight.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Prepare release notes
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { in_section = 1; print; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "a3s ${RELEASE_TAG}" > release-notes.md
          fi
      - name: Create or resume owned draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          current_tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [[ -z "$RELEASE_SHA" || "$current_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag ${tag} no longer resolves to the preflighted release commit"
            exit 1
          fi
          marker="<!-- a3s-cli-release-workflow:v1 sha:${RELEASE_SHA} -->"
          if release_json="$(gh release view "$tag" \
            --json body,isDraft,isPrerelease,name,tagName 2>/dev/null)"; then
            if ! jq -e \
              --arg tag "$tag" \
              --arg marker "$marker" \
              '.isDraft == true and .isPrerelease == false and .tagName == $tag
               and .name == $tag and (.body | contains($marker))' \
              <<<"$release_json" >/dev/null; then
              echo "::error::Release ${tag} already exists but is not this workflow's owned draft"
              exit 1
            fi
          else
            printf '\n%s\n' "$marker" >> release-notes.md
            gh release create "$tag" --draft --prerelease=false --title "$tag" \
              --notes-file release-notes.md --verify-tag
          fi

  native-sandbox-behavior:
    name: Exercise native local sandbox (${{ matrix.platform }})
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-22.04 }
          - { platform: macos, os: macos-15-intel }
          - { platform: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision Linux namespace boundary
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Prove the native sandbox integration
        shell: bash
        run: >-
          cargo test --locked --bin a3s
          commands::code::sandbox::tests::real_native_sandbox_enforces_local_policy
          -- --ignored --exact --nocapture

  binaries:
    needs:
      - release-preflight
      - webview-helper-preflight
      - moli-runtime-preflight
      - create-release
      - native-sandbox-behavior
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-preflight.outputs.release_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate immutable dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Download verified Agent Island helper
        uses: actions/download-artifact@v4
        with:
          name: a3s-webview-helper-${{ matrix.target }}
          path: webview-release
      - name: Bundle native Agent Island helper
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          HELPER_NAME: ${{ matrix.helper }}
        run: |
          set -euo pipefail
          tag="v${A3S_WEBVIEW_VERSION}"
          base="a3s-webview-${tag}-${RELEASE_TARGET}"
          archive_name="${base}.tar.gz"
          archive="webview-release/${archive_name}"
          checksum="webview-release/${base}.sha256"
          expected="$(awk -v asset="$archive_name" \
            '($2 == asset || $2 == "*" asset) \
             { digest = $1; count += 1 } END { if (count == 1) print digest }' \
            "$checksum")"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$archive" | awk '{ print $1 }')"
          else
            actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
          fi
          test -n "$expected" && test "$actual" = "$expected"
          mkdir webview-helper
          tar -xzf "$archive" -C webview-helper
          helper="$(find webview-helper -type f -name "$HELPER_NAME" -print -quit)"
          test -n "$helper"
          cp "$helper" "$HELPER_NAME"
          if [[ "$HELPER_NAME" != *.exe ]]; then chmod 0755 "$HELPER_NAME"; fi
      - name: Download verified Moli runtime
        uses: actions/download-artifact@v4
        with:
          name: moli-runtime-${{ matrix.target }}
          path: moli-release
      - name: Bundle native Moli runtime
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          MOLI_NAME: ${{ matrix.moli }}
        run: |
          set -euo pipefail
          mapfile -t moli_files < <(find moli-release -type f -name "$MOLI_NAME" -print)
          if [[ "${#moli_files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one packaged ${MOLI_NAME}, found ${#moli_files[@]}"
            exit 1
          fi
          moli_root="$(dirname "${moli_files[0]}")"
          test -f "$moli_root/moli-runtime.json"
          if find "$moli_root" -type l | grep -q .; then
            echo "::error::Moli package contains a symlink"
            exit 1
          fi
          rm -rf moli
          mkdir moli
          cp -R "$moli_root"/. moli/
          test -f "moli/$MOLI_NAME"
          jq -e \
            --arg version "$A3S_MOLI_VERSION" \
            --arg target "$RELEASE_TARGET" \
            '.schema == "a3s-code/moli-runtime-package/v1"
             and .version == $version and .target == $target
             and (.archive_sha256 | test("^[0-9a-f]{64}$"))' \
            moli/moli-runtime.json >/dev/null
          if [[ "$MOLI_NAME" == "moli" ]]; then chmod 0755 "moli/$MOLI_NAME"; fi
      - name: Set Intel macOS deployment target
        # Keep the published Intel CLI loadable on the supported macOS 12
        # baseline. The maintained Intel runner otherwise defaults to its
        # host SDK deployment version.
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
      - name: Build release archives
        uses: taiki-e/upload-rust-binary-action@v1
        env:
          # Full LTO repeatedly exceeded the observed hosted Linux ARM64
          # execution window. Keep local inference and bound that target's
          # build time; every other release target retains full LTO.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
        with:
          bin: a3s
          target: ${{ matrix.target }}
          features: ${{ matrix.features }}
          locked: true
          archive: a3s-${{ env.RELEASE_TAG }}-$target
          include: |
            ${{ matrix.helper }}
            moli
          tar: all
          zip: windows
          checksum: sha256
          dry-run: true
          dry-run-intended: true
      - name: Verify Moli is inside every release archive
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          MOLI_NAME: ${{ matrix.moli }}
        run: |
          set -euo pipefail
          base="a3s-${RELEASE_TAG}-${RELEASE_TARGET}"
          expected="moli/${MOLI_NAME}"
          entries_file="moli-archive-entries.txt"
          if [[ "$RELEASE_TARGET" == "x86_64-pc-windows-msvc" ]]; then
            archive="${base}.zip"
            if command -v unzip >/dev/null 2>&1; then
              unzip -Z1 "$archive" > "$entries_file"
            else
              7z l -slt "$archive" | awk -F'= ' '/^Path = / { print $2 }' > "$entries_file"
            fi
          else
            archive="${base}.tar.gz"
            tar -tzf "$archive" > "$entries_file"
          fi
          grep -Fqx "$expected" "$entries_file" || {
            echo "::error::${archive} does not contain ${expected}"
            exit 1
          }
      - name: Verify Intel macOS 12 binary contract
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          archive="a3s-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
          test -f "$archive"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          tar -xzf "$archive" -C "$unpacked"
          binary="$(find "$unpacked" -type f -name a3s -perm -111 -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "::error::Intel release archive does not contain an executable a3s binary"
            exit 1
          fi
          file_description="$(file -b "$binary")"
          if [[ "$file_description" != Mach-O\ 64-bit*\ x86_64* ]]; then
            echo "::error::Expected an x86_64 Mach-O CLI, got: $file_description"
            exit 1
          fi
          minos="$(otool -l "$binary" | awk '
            /LC_BUILD_VERSION/ { in_build = 1; next }
            in_build && /minos[[:space:]]/ { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { in_legacy = 1; next }
            in_legacy && /version[[:space:]]/ { print $2; exit }
          ')"
          if [[ -z "$minos" ]]; then
            echo "::error::Unable to read the Intel CLI minimum macOS version"
            exit 1
          fi
          min_major="${minos%%.*}"
          min_minor="${minos#*.}"
          min_minor="${min_minor%%.*}"
          if ! [[ "$min_major" =~ ^[0-9]+$ && "$min_minor" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Mach-O minimum macOS version: $minos"
            exit 1
          fi
          if (( min_major > 12 || (min_major == 12 && min_minor > 0) )); then
            echo "::error::Intel CLI requires macOS $minos; expected <= 12.0"
            exit 1
          fi
          echo "Verified Intel Mach-O x86_64 with minimum macOS $minos"
      - name: Verify owned draft and upload release archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          current_tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [[ -z "$RELEASE_SHA" || "$current_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag ${tag} no longer resolves to the preflighted release commit"
            exit 1
          fi
          marker="<!-- a3s-cli-release-workflow:v1 sha:${RELEASE_SHA} -->"
          release_json="$(gh release view "$tag" \
            --json body,isDraft,isPrerelease,name,tagName)"
          if ! jq -e \
            --arg tag "$tag" \
            --arg marker "$marker" \
            '.isDraft == true and .isPrerelease == false and .tagName == $tag
             and .name == $tag and (.body | contains($marker))' \
            <<<"$release_json" >/dev/null; then
            echo "::error::Release ${tag} is not this workflow's owned draft"
            exit 1
          fi

          base="a3s-${tag}-${RELEASE_TARGET}"
          assets=("${base}.tar.gz" "${base}.sha256")
          if [[ "$RELEASE_TARGET" == "x86_64-pc-windows-msvc" ]]; then
            assets+=("${base}.zip")
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Release build did not produce ${asset}"
              exit 1
            fi
          done
          gh release upload "$tag" "${assets[@]}" --clobber

  crate:
    needs: [create-release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN not set — cannot publish a3s to crates.io"; exit 1
          fi
          publish_dir="$(mktemp -d)"
          trap 'rm -rf "$publish_dir"' EXIT
          git archive HEAD | tar -x -C "$publish_dir"

          tag="$RELEASE_TAG"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          current_tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [[ -z "$RELEASE_SHA" || "$current_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag ${tag} no longer resolves to the preflighted release commit"
            exit 1
          fi
          marker="<!-- a3s-cli-release-workflow:v1 sha:${RELEASE_SHA} -->"
          release_json="$(gh release view "$tag" \
            --json body,isDraft,isPrerelease,name,tagName)"
          if ! jq -e \
            --arg tag "$tag" \
            --arg marker "$marker" \
            '.isDraft == true and .isPrerelease == false and .tagName == $tag
             and .name == $tag and (.body | contains($marker))' \
            <<<"$release_json" >/dev/null; then
            echo "::error::Release ${tag} is not this workflow's owned draft"
            exit 1
          fi

          version="${tag#v}"
          crate_version_exists() {
            curl --connect-timeout 5 --max-time 15 -fsSL \
              -A "a3s-release-check/1.0" \
              "https://crates.io/api/v1/crates/a3s/${version}" >/dev/null
          }
          if crate_version_exists; then
            echo "a3s ${version} is already published; continuing the owned draft release"
            exit 0
          fi

          set +e
          publish_output="$(cargo publish --locked \
            --manifest-path "$publish_dir/Cargo.toml" 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"
          if [[ "$publish_status" -eq 0 ]]; then
            exit 0
          fi
          for attempt in {1..12}; do
            if crate_version_exists; then
              echo "a3s ${version} is visible on crates.io; treating this as a resumed release"
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          exit "$publish_status"

  publish-release:
    needs: [create-release, binaries, crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify complete assets and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.create-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          {
            for target in \
              aarch64-apple-darwin \
              x86_64-apple-darwin \
              x86_64-unknown-linux-gnu \
              aarch64-unknown-linux-gnu \
              x86_64-pc-windows-msvc; do
              base="a3s-${tag}-${target}"
              printf '%s\n' "${base}.tar.gz" "${base}.sha256"
              if [[ "$target" == x86_64-pc-windows-msvc ]]; then
                printf '%s\n' "${base}.zip"
              fi
            done
          } | sort > expected-assets.txt
          gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort > actual-assets.txt
          if ! diff -u expected-assets.txt actual-assets.txt; then
            echo "::error::Release ${tag} does not contain the exact expected asset set"
            exit 1
          fi

          mkdir release-assets
          gh release download "$tag" --dir release-assets --pattern 'a3s-*'
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc; do
            base="a3s-${tag}-${target}"
            archives=("${base}.tar.gz")
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then
              archives+=("${base}.zip")
            fi
            checksum="release-assets/${base}.sha256"
            checksum_lines="$(awk 'END { print NR }' "$checksum")"
            checksum_entries="$(awk 'NF == 2 { count += 1 } END { print count + 0 }' "$checksum")"
            if [[ "$checksum_lines" -ne "${#archives[@]}" \
              || "$checksum_entries" -ne "${#archives[@]}" ]]; then
              echo "::error::${base}.sha256 does not contain exactly one entry per archive"
              exit 1
            fi
            for archive in "${archives[@]}"; do
              expected="$(awk -v asset="$archive" \
                '($2 == asset || $2 == "*" asset) \
                 && length($1) == 64 && $1 !~ /[^0-9a-f]/ \
                 { digest = $1; count += 1 } \
                 END { if (count == 1) print digest }' "$checksum")"
              if [[ -z "$expected" ]]; then
                echo "::error::${base}.sha256 has no unique valid digest for ${archive}"
                exit 1
              fi
              actual="$(sha256sum "release-assets/${archive}" | awk '{ print $1 }')"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::SHA-256 mismatch for ${archive}"
                exit 1
              fi
            done
          done

          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          current_tag_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
          if [[ -z "$RELEASE_SHA" || "$current_tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag ${tag} no longer resolves to the preflighted release commit"
            exit 1
          fi
          marker="<!-- a3s-cli-release-workflow:v1 sha:${RELEASE_SHA} -->"
          release_json="$(gh release view "$tag" \
            --json body,isDraft,isPrerelease,name,tagName)"
          if ! jq -e \
            --arg tag "$tag" \
            --arg marker "$marker" \
            '(.isDraft == true or .isDraft == false) and .isPrerelease == false
             and .tagName == $tag
             and .name == $tag and (.body | contains($marker))' \
            <<<"$release_json" >/dev/null; then
            echo "::error::Release ${tag} is not this workflow's owned non-prerelease release"
            exit 1
          fi
          if jq -e '.isDraft == true' <<<"$release_json" >/dev/null; then
            gh release edit "$tag" --draft=false --prerelease=false
          else
            echo "Release ${tag} is already public; continuing the interrupted publication"
          fi

  homebrew:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN not set — cannot update Homebrew tap"; exit 1
          fi
          tag="$RELEASE_TAG"; v="${tag#v}"
          base="https://github.com/A3S-Lab/CLI/releases/download/${tag}"
          sha() { curl -fsSL "$base/a3s-${tag}-$1.tar.gz" | sha256sum | cut -d' ' -f1; }
          mac_arm=$(sha aarch64-apple-darwin)
          mac_x86=$(sha x86_64-apple-darwin)
          lin_arm=$(sha aarch64-unknown-linux-gnu)
          lin_x86=$(sha x86_64-unknown-linux-gnu)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/A3S-Lab/homebrew-tap.git" tap
          cat > tap/Formula/a3s.rb <<RB
          class A3s < Formula
            desc "Coding agent CLI — a3s code launches the interactive TUI"
            homepage "https://github.com/A3S-Lab/CLI"
            license all_of: ["MIT", "Apache-2.0", "BSD-3-Clause"]
            depends_on "a3s-lab/tap/a3s-webview"

            on_macos do
              on_arm do
                url "${base}/a3s-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}/a3s-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_x86}"
              end
            end

            on_linux do
              depends_on "bubblewrap"
              on_arm do
                url "${base}/a3s-${tag}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_arm}"
              end
              on_intel do
                url "${base}/a3s-${tag}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${lin_x86}"
              end
            end

            def install
              bin.install "a3s"
              # Keep the target-specific Moli sidecar beside the executable;
              # Code Core discovers bin/moli/moli without a second download.
              bin.install "moli"
            end

            test do
              assert_match "a3s", shell_output("#{bin}/a3s --version")
              assert_predicate bin/"moli/moli", :exist?
            end
          end
          RB
          ruby -c tap/Formula/a3s.rb
          cd tap
          git config user.email "ci@a3s.dev"
          git config user.name "A3S CI"
          git add Formula/a3s.rb
          git diff --cached --quiet || git commit -m "a3s ${v} (automated)"
          git push

  homebrew-smoke:
    needs: homebrew
    runs-on: macos-15-intel
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Verify Homebrew install and reinstall
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          brew tap a3s-lab/tap https://github.com/A3S-Lab/homebrew-tap
          brew trust --tap a3s-lab/tap
          brew install a3s-lab/tap/a3s
          test "$(brew list --versions a3s | awk '{print $2}')" = "$version"
          brew test a3s-lab/tap/a3s
          brew reinstall a3s-lab/tap/a3s
          test "$(brew list --versions a3s | awk '{print $2}')" = "$version"
          brew test a3s-lab/tap/a3s
