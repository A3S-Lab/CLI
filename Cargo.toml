[package]
name = "a3s"
version = "0.21.0"
edition = "2021"
description = "a3s — A3S coding agent CLI; `a3s code` launches the interactive TUI"
license = "MIT"
repository = "https://github.com/A3S-Lab/CLI"
homepage = "https://github.com/A3S-Lab/a3s"
readme = "README.md"
keywords = ["a3s", "cli", "agent", "tui", "coding"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "skills/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "a3s"
path = "src/main.rs"

[dependencies]
# Published pin. `a3s code exec` links this git revision. Interactive
# `a3s code` launches the external pager and does not link this crate.
a3s-code-core = { version = "=9.1.1", git = "https://github.com/A3S-Lab/Code.git", rev = "3798d9cd82a8521dfad9aa92910610d84fd9b776", default-features = false, features = ["scientific"] }
a3s-boot = { version = "=0.1.3", features = ["ilink"] }
# Durable memory for `a3s code exec`. Same crate and version a3s-code-core uses.
a3s-memory = { version = "=0.1.4", git = "https://github.com/A3S-Lab/Memory.git", rev = "97a5e885d196be77dc1823ad86238e77d942ed73" }
# Memory convergence: the single memory store runs on A3S's own engine.
a3s-vec = "=0.1.8"
a3s-acl = "=0.2.2"
a3s-updater = "=0.3.0"
a3s-use-core = "=0.2.10"
a3s-use-extension = "=0.3.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "fs", "signal"] }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
olpc-cjson = "0.1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
async-trait = "0.1"
tokio-util = "0.7"
base64 = "0.22"
futures = "0.3"
fs2 = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls", "socks", "stream"] }
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
a3s-box-runtime = { version = "=3.2.0", default-features = false, features = ["vm"] }
# Runtime 3.2.0 accepts netproxy ^3.2. 3.3.0 calls core types that 3.2.0 does not export.
a3s-box-netproxy = "=3.2.7"

[target.'cfg(target_os = "linux")'.dev-dependencies]
a3s-box-core = "=3.2.0"
a3s-box-runtime = { version = "=3.2.0", default-features = false, features = ["runtime-provider-qualification"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
flate2 = "1"
ring = "0.17"
tar = "0.4"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Exact workspace-vector search is latency-sensitive; keep the CLI compact
# while compiling this dependency's scan kernel for speed.
[profile.release.package.a3s-memory]
opt-level = 3

# a3s-effect 0.1.1 is the trait surface Core 9.1.1 compiles against, and it
# is not on crates.io. a3s-vec 0.1.8 resolves from crates.io.
[patch.crates-io]
a3s-effect = { version = "0.1.1", git = "https://github.com/A3S-Lab/Effect.git", rev = "08a11f782190cf8f83e034064dd018a3f99ec9e1" }
