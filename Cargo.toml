[package]
name = "a3s"
version = "0.13.5"
edition = "2021"
description = "a3s — A3S coding agent CLI; `a3s code` launches the interactive TUI"
license = "MIT"
repository = "https://github.com/A3S-Lab/CLI"
homepage = "https://github.com/A3S-Lab/a3s"
readme = "README.md"
keywords = ["a3s", "cli", "agent", "tui", "coding"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "skills/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "a3s"
path = "src/main.rs"

[features]
default = []
local-cpu-embedding = ["dep:a3s-power", "dep:fastembed"]

[dependencies]
a3s-code-core = { version = "=8.0.4", git = "https://github.com/A3S-Lab/Code.git", rev = "96be2ce34695341f477644bd3c36cf4aa6c39d4f" }
a3s-power = { version = "=0.9.0", default-features = false, features = ["artifact-provisioning"], optional = true }
a3s-deep-research = "=0.1.4"
a3s-boot = { version = "=0.1.3", features = ["ilink"] }
a3s-lane = "=0.5.1"
a3s-flow = { version = "=1.1.0", git = "https://github.com/A3S-Lab/Flow.git", rev = "2948ad51a1395177764766c3ddf7e44338f9e374" }
# Long-term memory store (same crate/version a3s-code-core uses) — the `/ctx save`
# fusion writes ctx findings into it as durable MemoryItems.
a3s-memory = { version = "=0.1.3", git = "https://github.com/A3S-Lab/Memory.git", rev = "df5a811e65a44e045a7e631455699d075877651e" }
a3s-tui = "=0.1.14"
a3s-acl = "=0.2.2"
a3s-updater = "=0.3.0"
a3s-use = { version = "=0.3.4", default-features = false, features = ["browser", "extensions", "mcp"] }
a3s-use-core = "=0.2.4"
a3s-use-extension = "=0.3.4"
a3s-runtime = "=0.3.0"
a3s-gateway = "=1.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "fs", "signal"] }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
olpc-cjson = "0.1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Codex account client (custom LlmClient over the ChatGPT backend).
async-trait = "0.1"
tokio-util = "0.7"
base64 = "0.22"
futures = "0.3"
fs2 = "0.4"
httpdate = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls", "socks", "stream"] }
# RMCP 0.8 uses reqwest 0.12. Keep the existing product HTTP client on its
# current ABI while giving private Gateway MCP probes a proxy-free matching
# client type.
reqwest-rmcp = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "client", "macros", "server", "transport-io", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
thiserror = "2"
webpki-roots = "1"
sha2 = "0.10"
sysinfo = "0.36.1"
axum = "0.8"
comrak = { version = "0.36", default-features = false }
tempfile = "3"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v5"] }
fastembed = { version = "=5.17.3", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
a3s-box-runtime = { version = "=3.2.0", default-features = false, features = ["vm"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
a3s-box-core = "=3.2.0"
a3s-box-runtime = { version = "=3.2.0", default-features = false, features = ["runtime-provider-qualification"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
flate2 = "1"
ring = "0.17"
tar = "0.4"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# Exact workspace-vector search is latency-sensitive; keep the CLI compact
# while compiling this dependency's scan kernel for speed.
[profile.release.package.a3s-memory]
opt-level = 3
