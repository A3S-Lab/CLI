[package]
name = "a3s"
version = "0.11.1"
edition = "2021"
description = "a3s — A3S coding agent CLI; `a3s code` launches the interactive TUI"
license = "MIT"
repository = "https://github.com/A3S-Lab/CLI"
homepage = "https://github.com/A3S-Lab/a3s"
readme = "README.md"
keywords = ["a3s", "cli", "agent", "tui", "coding"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "!tests/legacy_self_update_bridge.rs",
    "skills/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "!release-compat/**",
]

[[bin]]
name = "a3s"
path = "src/main.rs"

[dependencies]
a3s-code-core = "=6.8.0"
a3s-deep-research = "=0.1.3"
a3s-boot = { version = "=0.1.3", features = ["ilink"] }
a3s-lane = "=0.5.1"
a3s-flow = "=0.4.3"
# Long-term memory store (same crate/version a3s-code-core uses) — the `/ctx save`
# fusion writes ctx findings into it as durable MemoryItems.
a3s-memory = "0.1.2"
a3s-tui = "=0.1.14"
a3s-acl = "=0.2.2"
a3s-updater = "=0.3.0"
a3s-use = { git = "https://github.com/A3S-Lab/Use", rev = "9c6b7a795c0fec730c5fbe6f7ec9d14e586084c8", default-features = false, features = ["extensions"] }
a3s-use-core = { git = "https://github.com/A3S-Lab/Use", rev = "9c6b7a795c0fec730c5fbe6f7ec9d14e586084c8" }
a3s-use-extension = { git = "https://github.com/A3S-Lab/Use", rev = "9c6b7a795c0fec730c5fbe6f7ec9d14e586084c8" }
a3s-runtime = { git = "https://github.com/A3S-Lab/Runtime", rev = "cfaac63af6f76beebdc64a1ec228cedc42bb98ec" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "fs", "signal"] }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Codex account client (custom LlmClient over the ChatGPT backend).
async-trait = "0.1"
tokio-util = "0.7"
base64 = "0.22"
futures = "0.3"
fs2 = "0.4"
http-body-util = "0.1"
httpdate = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls", "socks", "stream"] }
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
thiserror = "2"
webpki-roots = "1"
sha2 = "0.10"
sysinfo = "0.36.1"
axum = "0.8"
comrak = { version = "0.36", default-features = false }
tempfile = "3"
tracing = "0.1"
notify = "8.2"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }

[dev-dependencies]
flate2 = "1"
olpc-cjson = "0.1"
ring = "0.17"
tar = "0.4"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

[patch.crates-io]
# Monorepo development builds exercise the local A3S crates so Code, Search,
# Browser, and Use changes are validated as one integration rather than waiting
# for every intermediate release to reach crates.io.
a3s-code-core = { path = "../code/core" }
a3s-deep-research = { path = "../deep-research" }
a3s-acl = { path = "../acl" }
a3s-boot = { path = "../boot" }
a3s-common = { path = "../common" }
a3s-lane = { path = "../lane" }
a3s-memory = { path = "../memory" }
a3s-tui = { path = "../tui" }
a3s-updater = { path = "../updater" }
a3s-use-core = { path = "../use/crates/core" }
a3s-use-extension = { path = "../use/crates/extension" }

[patch."https://github.com/A3S-Lab/Search.git"]
a3s-search = { path = "../search" }

[patch."https://github.com/A3S-Lab/Browser"]
a3s-use-browser = { path = "../browser/crates/browser" }

[patch."https://github.com/A3S-Lab/Use"]
a3s-use = { path = "../use" }
a3s-use-core = { path = "../use/crates/core" }
a3s-use-extension = { path = "../use/crates/extension" }
