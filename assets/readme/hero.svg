<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">A3S CLI — one agent workspace in the terminal</title>
  <desc id="desc">A3S Code runs as a terminal TUI or bounded headless command. The main branch adds a reviewed cognitive-package lifecycle that publishes exact capability generations while unavailable adapters fail closed.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#7d8796" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="498" rx="25" fill="none" stroke="#252c37"/>

  <g id="identity" transform="translate(54 42)">
    <rect width="46" height="46" rx="10" fill="#f0b65b"/>
    <path d="m11 33 11-20h3.6L37 33h-6.2l-1.9-3.7H18.2L16.3 33Zm10-9.3h5.2l-2.6-5Z" fill="#080b10"/>
    <text x="64" y="22" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="750" letter-spacing="3">A3S CLI</text>
    <text x="64" y="45" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.1">UMBRELLA CLI · CODE HOST</text>
  </g>

  <g id="status" transform="translate(744 48)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <circle cx="7" cy="7" r="5" fill="#55dda2"/>
    <text x="22" y="13" fill="#c7cfda">PUBLIC CODE</text>
    <circle cx="175" cy="7" r="5" fill="#f0b65b"/>
    <text x="190" y="13" fill="#c7cfda">MAIN PACKAGE PREVIEW</text>
  </g>

  <g id="headline" transform="translate(54 138)">
    <text fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="790" letter-spacing="-2.4">A3S CLI</text>
    <text y="70" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="760" letter-spacing="-1.1">BUILD IN THE TERMINAL.</text>
    <text y="120" fill="#f0b65b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="760" letter-spacing="-1.1">AUTOMATE WITH EVIDENCE.</text>
    <text y="165" fill="#aeb7c4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">One configuration · one session model · one capability watch</text>
  </g>

  <g id="terminal-proof" transform="translate(742 104)">
    <rect width="404" height="300" rx="18" fill="#0c1016" stroke="#3a424f" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="#f0b65b"/>
    <circle cx="42" cy="24" r="5" fill="#566170"/>
    <circle cx="60" cy="24" r="5" fill="#55dda2"/>
    <text x="380" y="30" text-anchor="end" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">LOCAL HOST</text>

    <g transform="translate(24 64)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text fill="#55dda2" font-size="20">$</text>
      <text x="25" fill="#f4f7fb" font-size="20" font-weight="700">a3s code</text>
      <text x="356" text-anchor="end" fill="#9bc1ff" font-size="18">TUI</text>
      <text y="42" fill="#55dda2" font-size="20">$</text>
      <text x="25" y="42" fill="#f4f7fb" font-size="20" font-weight="700">a3s code exec …</text>
      <text x="356" y="42" text-anchor="end" fill="#9bc1ff" font-size="18">HEADLESS</text>

      <path d="M0 68 H356" stroke="#2f3742"/>
      <text y="104" fill="#f0b65b" font-size="20">$</text>
      <text x="25" y="104" fill="#f4f7fb" font-size="19" font-weight="700">a3s plugin install …</text>
      <text x="356" y="104" text-anchor="end" fill="#f5d49d" font-size="17">MAIN</text>
    </g>

    <g transform="translate(24 206)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
      <rect width="96" height="42" rx="9" fill="#f0b65b" fill-opacity="0.1" stroke="#f0b65b"/>
      <text x="48" y="27" text-anchor="middle" fill="#f5d49d">REVIEW</text>
      <path d="M108 21 H136" fill="none" stroke="#7d8796" stroke-width="1.6" marker-end="url(#arrow)"/>
      <rect x="148" width="106" height="42" rx="9" fill="#55dda2" fill-opacity="0.1" stroke="#55dda2"/>
      <text x="201" y="27" text-anchor="middle" fill="#8ce9bd">GEN N+1</text>
      <path d="M266 21 H294" fill="none" stroke="#7d8796" stroke-width="1.6" marker-end="url(#arrow)"/>
      <rect x="306" width="74" height="42" rx="9" fill="#5794ff" fill-opacity="0.12" stroke="#5794ff"/>
      <text x="343" y="27" text-anchor="middle" fill="#9bc1ff">LIVE</text>
    </g>

    <text x="24" y="278" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">READY SURFACES ONLY · NO SILENT FALLBACK</text>
  </g>

  <path d="M54 430 H1146" stroke="#252c37"/>
  <g transform="translate(54 462)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="650">
    <text fill="#55dda2">CODE TUI + EXEC ARE PUBLIC</text>
    <text x="278" fill="#4c5665">|</text>
    <text x="306" fill="#f0b65b">COGNITIVE PACKAGES ARE A SOURCE PREVIEW</text>
    <text x="1092" text-anchor="end" fill="#929dad">A3S-LAB / CLI</text>
  </g>
</svg>
