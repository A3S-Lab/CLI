<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A3S cognitive-package host architecture on main</title>
  <desc id="desc">Explicitly trusted package sources enter one Plugin Manager. A3S Use verifies and resolves the dependency graph, Code composes native, Flow, static, managed Runtime Task, and OKF Knowledge hosts, and an exact-generation snapshot reaches the Code TUI while unavailable production providers fail closed.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#7d8796" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="618" rx="25" fill="none" stroke="#252c37"/>

  <g transform="translate(54 42)">
    <text fill="#f0b65b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.3">MAIN-BRANCH PACKAGE HOST</text>
    <text y="52" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="41" font-weight="770" letter-spacing="-1.2">Trust once. Resolve one graph. Publish one generation.</text>
  </g>

  <g id="sources" transform="translate(54 126)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text y="-10" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">EXPLICIT SOURCE SET</text>
    <g>
      <rect width="170" height="66" rx="12" fill="#111721" stroke="#3a424f"/>
      <text x="85" y="29" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">Local</text>
      <text x="85" y="52" text-anchor="middle" fill="#929dad" font-size="18">explicit trust</text>
    </g>
    <g transform="translate(186)">
      <rect width="184" height="66" rx="12" fill="#111721" stroke="#3a424f"/>
      <text x="92" y="29" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">Release bundle</text>
      <text x="92" y="52" text-anchor="middle" fill="#929dad" font-size="18">exact digest</text>
    </g>
    <g transform="translate(386)">
      <rect width="214" height="66" rx="12" fill="#10171a" stroke="#55dda2"/>
      <text x="107" y="29" text-anchor="middle" fill="#dff9ed" font-size="20" font-weight="700">Named TUF source</text>
      <text x="107" y="52" text-anchor="middle" fill="#8ce9bd" font-size="18">URL + pinned root</text>
    </g>
    <path d="M616 33 H666" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>
    <g transform="translate(682)">
      <rect width="410" height="66" rx="12" fill="#18150f" stroke="#f0b65b" stroke-width="1.5"/>
      <text x="205" y="29" text-anchor="middle" fill="#f5d49d" font-size="21" font-weight="750">Host Plugin Manager</text>
      <text x="205" y="53" text-anchor="middle" fill="#c5ad84" font-size="18">ACL policy · reviewed digest · durable intent</text>
    </g>
  </g>

  <path d="M941 192 V224" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="lifecycle" transform="translate(54 238)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g id="use-graph">
      <rect width="470" height="158" rx="16" fill="#0c1016" stroke="#5794ff" stroke-width="1.5"/>
      <text x="24" y="34" fill="#9bc1ff" font-size="23" font-weight="750">A3S Use package graph</text>
      <text x="24" y="70" fill="#f4f7fb" font-size="19">verify manifest + package content</text>
      <text x="24" y="99" fill="#f4f7fb" font-size="19">resolve SemVer closure + source lock</text>
      <text x="24" y="128" fill="#f4f7fb" font-size="19">journal lifecycle + atomic cutover</text>
      <text x="446" y="137" text-anchor="end" fill="#55dda2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">GEN N+1</text>
    </g>

    <path d="M486 79 H526" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>

    <g id="code-host" transform="translate(542)">
      <rect width="550" height="158" rx="16" fill="#0c1016" stroke="#3a424f" stroke-width="1.5"/>
      <text x="24" y="34" fill="#f4f7fb" font-size="23" font-weight="750">Code lifecycle host</text>
      <path d="M275 52 V136" stroke="#2f3742"/>

      <circle cx="28" cy="70" r="6" fill="#55dda2"/>
      <text x="44" y="76" fill="#8ce9bd" font-size="19" font-weight="700">COMPOSED</text>
      <text x="24" y="105" fill="#f4f7fb" font-size="18">Skill · UI · stdio MCP</text>
      <text x="24" y="132" fill="#f4f7fb" font-size="18">Flow · OKF · Runtime Tasks</text>

      <circle cx="303" cy="70" r="6" fill="#f0b65b"/>
      <text x="319" y="76" fill="#f5d49d" font-size="19" font-weight="700">GATED</text>
      <text x="299" y="105" fill="#f4f7fb" font-size="18">OCI Runtime · HTTP MCP</text>
      <text x="299" y="132" fill="#f4f7fb" font-size="18">Services · Gateway readiness</text>
    </g>
  </g>

  <path d="M600 396 V428" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="snapshot" transform="translate(236 442)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="728" height="68" rx="14" fill="#132019" stroke="#55dda2" stroke-width="1.5"/>
    <circle cx="32" cy="34" r="8" fill="#55dda2"/>
    <text x="54" y="29" fill="#dff9ed" font-size="21" font-weight="750">Exact-generation capability snapshot</text>
    <text x="54" y="53" fill="#8ce9bd" font-size="18">revision · exact identity · cited Knowledge · Runtime Tasks · watch</text>
    <text x="696" y="42" text-anchor="end" fill="#55dda2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">GEN N+1</text>
  </g>

  <g id="consumers" transform="translate(54 548)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
    <g>
      <rect width="322" height="48" rx="11" fill="#5794ff" fill-opacity="0.12" stroke="#5794ff"/>
      <text x="161" y="31" text-anchor="middle" fill="#9bc1ff">CODE TUI · SKILL/OKF/TASK</text>
    </g>
    <g transform="translate(338)">
      <rect width="416" height="48" rx="11" fill="#5794ff" fill-opacity="0.12" stroke="#5794ff"/>
      <text x="208" y="31" text-anchor="middle" fill="#9bc1ff">A3S CODE · PACKAGES/OKF/TASK</text>
    </g>
    <g transform="translate(770)">
      <rect width="322" height="48" rx="11" fill="#f4f7fb" fill-opacity="0.05" stroke="#7d8796"/>
      <text x="161" y="31" text-anchor="middle" fill="#d8dee8">USE WORKER · MCP/SKILL/TASK</text>
    </g>
  </g>
</svg>
