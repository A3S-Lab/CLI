<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A3S cognitive-package hot-plug architecture</title>
  <desc id="desc">Replaceable local, release, and TUF Registry sources enter one host Plugin Manager. A3S Use resolves a locked package graph and Code composes Runtime, A3S Flow, static, Gateway, and Knowledge lifecycle hosts. Only exact-generation readiness evidence reaches the shared capability snapshot observed by Code TUI, Web, and the dedicated Use worker.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#7d8796" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="718" rx="25" fill="none" stroke="#252c37"/>

  <g transform="translate(54 42)">
    <text fill="#f0b65b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.4">HOST-COMPOSED PACKAGE LIFECYCLE</text>
    <text y="54" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="43" font-weight="760" letter-spacing="-1.2">One reviewed graph. One cutover. Two live product surfaces.</text>
  </g>

  <g id="sources" transform="translate(54 132)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text y="-12" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1">REPLACEABLE SOURCE SET</text>
    <g>
      <rect width="190" height="72" rx="13" fill="#111721" stroke="#3a424f"/>
      <text x="95" y="32" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">Local package</text>
      <text x="95" y="56" text-anchor="middle" fill="#929dad" font-size="18">explicit trust</text>
    </g>
    <g transform="translate(210)">
      <rect width="190" height="72" rx="13" fill="#111721" stroke="#3a424f"/>
      <text x="95" y="32" text-anchor="middle" fill="#f4f7fb" font-size="20" font-weight="700">Release bundle</text>
      <text x="95" y="56" text-anchor="middle" fill="#929dad" font-size="18">exact digest</text>
    </g>
    <g transform="translate(420)">
      <rect width="248" height="72" rx="13" fill="#10171a" stroke="#55dda2"/>
      <text x="124" y="32" text-anchor="middle" fill="#dff9ed" font-size="20" font-weight="700">Named TUF Registry</text>
      <text x="124" y="56" text-anchor="middle" fill="#8ce9bd" font-size="18">URL + pinned root</text>
    </g>
    <path d="M680 36 H724" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>
    <g transform="translate(740)">
      <rect width="406" height="72" rx="13" fill="#18150f" stroke="#f0b65b" stroke-width="1.5"/>
      <text x="203" y="31" text-anchor="middle" fill="#f5d49d" font-size="20" font-weight="750">Host Plugin Manager</text>
      <text x="203" y="56" text-anchor="middle" fill="#c5ad84" font-size="18">ACL policy · reviewed digest · durable intent</text>
    </g>
  </g>

  <path d="M943 204 V236" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="lifecycle" transform="translate(54 250)">
    <rect width="1092" height="274" rx="18" fill="#0c1016" stroke="#3a424f" stroke-width="1.5"/>
    <g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text fill="#f4f7fb" font-size="24" font-weight="750">A3S Use graph + Code lifecycle factory</text>
      <text y="31" fill="#929dad" font-size="18">resolve SemVer closure → freeze source lock → install forward → publish once → remove reverse</text>
    </g>

    <g transform="translate(24 94)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g>
        <rect width="248" height="126" rx="13" fill="#101620" stroke="#5794ff"/>
        <circle cx="24" cy="24" r="6" fill="#55dda2"/>
        <text x="40" y="30" fill="#9bc1ff" font-size="20" font-weight="750">Runtime host</text>
        <text x="20" y="62" fill="#f4f7fb" font-size="18">Executable Tool Task</text>
        <text x="20" y="88" fill="#f4f7fb" font-size="18">stdio MCP</text>
        <text x="20" y="113" fill="#8ce9bd" font-size="18" font-weight="700">COMPOSED</text>
      </g>
      <g transform="translate(264)">
        <rect width="248" height="126" rx="13" fill="#171221" stroke="#b982ff" stroke-width="1.5"/>
        <circle cx="24" cy="24" r="6" fill="#55dda2"/>
        <text x="40" y="30" fill="#d5b5ff" font-size="20" font-weight="750">A3S Flow host</text>
        <text x="20" y="62" fill="#f4f7fb" font-size="18">engine: a3s-flow</text>
        <text x="20" y="88" fill="#f4f7fb" font-size="18">runtime: native-ts</text>
        <text x="20" y="113" fill="#8ce9bd" font-size="18" font-weight="700">PREFLIGHT + BINDING</text>
      </g>
      <g transform="translate(528)">
        <rect width="232" height="126" rx="13" fill="#10171a" stroke="#55dda2"/>
        <circle cx="24" cy="24" r="6" fill="#55dda2"/>
        <text x="40" y="30" fill="#8ce9bd" font-size="20" font-weight="750">Static host</text>
        <text x="20" y="62" fill="#f4f7fb" font-size="18">Skill</text>
        <text x="20" y="88" fill="#f4f7fb" font-size="18">UI assets</text>
        <text x="20" y="113" fill="#8ce9bd" font-size="18" font-weight="700">CONTENT-BOUND</text>
      </g>
      <g transform="translate(776)">
        <rect width="268" height="126" rx="13" fill="#18150f" stroke="#f0b65b"/>
        <circle cx="24" cy="24" r="6" fill="#f0b65b"/>
        <text x="40" y="30" fill="#f5d49d" font-size="20" font-weight="750">Injected adapters</text>
        <text x="20" y="62" fill="#f4f7fb" font-size="18">OKF · Tool Service</text>
        <text x="20" y="88" fill="#f4f7fb" font-size="18">HTTP MCP</text>
        <text x="20" y="113" fill="#f0b65b" font-size="18" font-weight="700">ABSENT → FAIL CLOSED</text>
      </g>
    </g>

    <text x="24" y="252" fill="#929dad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">A3S_FLOW_NATIVE_TS_COMPILER selects the reviewed native compiler · exact scope/package/surface/generation evidence is persisted</text>
  </g>

  <path d="M600 524 V555" fill="none" stroke="#7d8796" stroke-width="1.8" marker-end="url(#arrow)"/>

  <g id="snapshot" transform="translate(228 568)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="744" height="66" rx="14" fill="#132019" stroke="#55dda2" stroke-width="1.5"/>
    <circle cx="32" cy="33" r="8" fill="#55dda2"/>
    <text x="54" y="29" fill="#dff9ed" font-size="21" font-weight="750">Atomic capability snapshot + long-poll watch</text>
    <text x="54" y="52" fill="#8ce9bd" font-size="18">generation · revision · readiness · immutable source evidence</text>
    <text x="703" y="40" text-anchor="end" fill="#55dda2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">GEN N</text>
  </g>

  <g id="consumers" transform="translate(54 672)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
    <text fill="#9bc1ff">CODE TUI /USE</text>
    <text x="245" fill="#677181">·</text>
    <text x="282" fill="#9bc1ff">CODE WEB + /PLUGINS/FLOWS</text>
    <text x="690" fill="#677181">·</text>
    <text x="726" fill="#cbd3de">USE WORKER</text>
    <text x="1092" text-anchor="end" fill="#55dda2">HOT-PLUG</text>
  </g>
</svg>
